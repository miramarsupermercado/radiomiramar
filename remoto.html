<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Remoto Profissional - Rádio Miramar</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f39c12;
            --bg: #0f1115;
            --card: #1a1d23;
            --text: #f8f9fa;
            --accent: #2ecc71;
            --danger: #e74c3c;
            --recording: #ff4757;
            --purple: #9b59b6;
            --ai: #00d2ff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tab-btn {
            background: #252932;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #444;
            font-weight: bold;
        }
        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .controles-gerais {
            background: #252932;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .botoes-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .msg-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .ai-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            padding: 10px;
            background: rgba(0, 210, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .msg-input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: white;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-orange { background: var(--primary); color: white; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-blue { background: #3498db; color: white; }
        .btn-purple { background: var(--purple); color: white; }
        .btn-ai { background: var(--ai); color: #000; }
        .btn-muted-active { background: var(--danger) !important; color: white !important; }
        .btn-select { background: #555; color: white; }
        .btn-clean { background: transparent; color: #777; border: 1px solid #444; font-size: 0.6rem; padding: 5px 10px; margin-top: 10px; }
        .btn-add { background: #2ecc71; color: white; font-size: 0.65rem; padding: 8px; flex: 1; }
        .btn-add-next { background: #3498db; }
        
        .btn-record { background: var(--recording); color: white; }
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
            background: var(--recording) !important;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .search-box {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #3d4451;
            background: #0f1115;
            color: white;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .section-title {
            margin: 30px 0 15px 0;
            color: var(--primary);
            font-size: 1.2rem;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }
        #results {
            max-height: 300px;
            overflow-y: auto;
            background: #1a1d23;
            border-radius: 10px;
            margin-top: 10px;
        }
        .result-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid transparent;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card.selected {
            border-color: var(--primary);
            background: #1e222a;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.15);
        }
        .card.muted-card {
            border-color: var(--danger);
        }
        .checkbox-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 2;
        }
        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .instancia-nome {
            color: var(--primary);
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 8px;
            display: block;
            opacity: 0.8;
        }
        .musica-atual {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
            color: #fff;
            line-height: 1.4;
        }
        .info-row {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .playing { background: rgba(46, 204, 113, 0.2); color: var(--accent); }
        .paused { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .mute-label-big {
            color: var(--danger);
            font-weight: 800;
            font-size: 1.2rem;
            text-align: center;
            padding: 10px;
            border: 1px dashed var(--danger);
            border-radius: 8px;
            margin-top: 10px;
        }
        .volume-individual {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .vol-label {
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: var(--primary);
            font-weight: bold;
        }
        .tempo-restante {
            font-weight: bold;
            color: #ff9f43;
            margin-left: auto;
        }
        .proximas-container {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .proximas-titulo {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .proximas-lista {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.75rem;
        }
        .proxima-item {
    padding: 4px 0;
    color: #ccc;
    border-bottom: 1px dashed rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    box-sizing: border-box;
}
        .proxima-item:last-child {
            border-bottom: none;
        }
        .proxima-num {
            color: var(--primary);
            font-weight: bold;
        }

        .proxima-nome {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

        .btn-remover-proxima {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    padding: 3px;
    margin-left: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    background: transparent;
    color: #e74c3c;

    cursor: pointer;
    border-radius: 5px;

    transition: all 0.2s ease;
}

.btn-remover-proxima:hover {
    background: rgba(231, 76, 60, 0.15);
    color: #ff6b5b;
    transform: scale(1.1);
}

.btn-remover-proxima svg {
    pointer-events: none;
}
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast {
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-left: 5px solid var(--primary);
            animation: slideIn 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .mini-ranking { margin-top: 10px; }
        .ranking-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        /* Estilos do Mix de Gêneros */
        .genre-card {
            background: var(--card);
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            margin: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .genre-row {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .genre-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-save-preset {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save-preset:hover { background: #27ae60; }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div class="header">
        <h1>Centro de Comando Remoto</h1>
        <p id="count">Detectando estúdios online...</p>
        <button class="btn-clean" onclick="limparEstudiosAntigos()">🧹 Limpar IDs Fantasmas</button>
    </div>
    <div class="tabs">
        <div class="tab-btn active" onclick="openTab('aba-controle')">🎛️ Controles</div>
        <div class="tab-btn" onclick="openTab('aba-generos')">🎛️ Mix de Gêneros</div>
        <div class="tab-btn" onclick="openTab('aba-ranking')">📊 Rankings por Estúdio</div>
    </div>
    <div id="aba-controle" class="tab-content active">
        <div class="controles-gerais">
            <div class="botoes-row">
                <button class="btn-select" onclick="toggleSelectAll()">Selecionar Todos</button>
                <button onclick="atualizarNavegadorRemoto()">🔄 Atualizar Navegador</button>
                <button class="btn-orange" onclick="enviarComando('PROXIMA_MUSICA')">Pular Música</button>
                <button id="btnMuteMaster" class="btn-blue" onclick="enviarComando('TOGGLE_MUTE')">Mute/Unmute</button>
                <button class="btn-red" onclick="enviarComando('TOCAR_AVISO')">📢 Aviso Pão</button>
                <button id="btnRecord" class="btn-record" onclick="toggleGravarLocucao()">🎤 Locução em HD</button>
                <button class="btn-purple" onclick="document.getElementById('fileUpload').click()">📁 Enviar Áudios HQ</button>
                <button class="btn-red" onclick="removerEstudiosSelecionados()">🗑️ Remover Estúdios</button>
                <input type="file" id="fileUpload" style="display: none;" accept="audio/*" multiple onchange="processarArquivosAudio(this)">
            </div>
            
            <div class="ai-row">
                <input type="text" id="placaInput" class="msg-input" placeholder="Digite a placa (ex: ABC-1234)...">
                <button class="btn-ai" onclick="gerarLocucaoIA()">🤖 Anunciar Placa</button>
            </div>

            <div class="msg-row">
                <input type="text" id="msgInput" class="msg-input" placeholder="Enviar mensagem para o ecrã do estúdio...">
                <button class="btn-blue" onclick="enviarMensagem()">Enviar Msg</button>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar música na biblioteca..." oninput="filtrarMusicas(this.value)">
            <div id="results"></div>
        </div>
        <div class="section-title">🎙️ Estúdios Ativos</div>
        <div class="grid" id="instancias-grid"></div>
    </div>

    <div id="aba-generos" class="tab-content">
        <div class="genre-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color:var(--primary); margin: 0;">Mix de Gêneros Proporcional</h2>
                <button onclick="saveGenrePreset()" class="btn-save-preset">💾 SALVAR PRESET</button>
            </div>
            <div id="sliders-container">Carregando gêneros...</div>
            <div id="total-info" style="margin-top:20px; font-weight:bold; text-align:center; font-size:1.1rem;">Total: 100%</div>
            <button onclick="aplicarMixNosEstudios()" class="btn-orange" style="width: 100%; margin-top: 20px; padding: 15px; font-size: 0.9rem;">REGENERAR PROGRAMAÇÃO NOS ESTÚDIOS SELECIONADOS</button>
        </div>
    </div>

    <div id="aba-ranking" class="tab-content">
        <div class="section-title">📊 Rankings Individuais</div>
        <div class="grid" id="ranking-grid"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://radiomiramar-52436-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let selecionados = new Set();
        let todasKeys = [];
        let bibliotecaMusicas = [];
        let musicLibrary = {};
        let genreMix = {};
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function showToast(mensagem) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>✅</span> ${mensagem}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(event) event.currentTarget.classList.add('active');
        }

        async function carregarBiblioteca() {
            bibliotecaMusicas = []; 
            musicLibrary = {};
            const arquivos = ['MUSICAS.m3u', 'MUSICAS72H.m3u'];
            
            for (const file of arquivos) {
                try {
                    const response = await fetch(`${file}?t=${Date.now()}`);
                    if (response.ok) {
                        const text = await response.text();
                        parseM3U(text);
                    }
                } catch (e) {
                    console.error(`Erro biblioteca (${file}):`, e);
                }
            }
            setupGenreUI();
        }

        function parseM3U(text) {
            const lines = text.split(/\r?\n/);
            let currentName = "";
            let currentGenre = "Geral";
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    // HIGIENIZA O NOME DO GÊNERO PARA EVITAR ERROS NO FIREBASE
                    if (groupMatch) currentGenre = groupMatch[1].replace(/[.#$/\[\]]/g, '-');
                    const targetMarker = '",';
                    const markerPos = line.indexOf(targetMarker);
                    if (markerPos !== -1) { currentName = line.substring(markerPos + targetMarker.length).trim(); } 
                    else { const lastComma = line.lastIndexOf('",'); if (lastComma !== -1) currentName = line.substring(lastComma + 1).trim(); }
                    if (!currentName) currentName = line.split(',').pop();
                } else if (line !== "" && !line.startsWith('#')) {
                    let url = line.replace(/\\/g, '/');
                    if (!url.startsWith('http') && !url.startsWith('./')) url = './' + url;
                    const item = { name: currentName || line.split('/').pop().replace(/\.[^/.]+$/, ""), url: url, genre: currentGenre };
                    bibliotecaMusicas.push(item);
                    if (!musicLibrary[currentGenre]) musicLibrary[currentGenre] = [];
                    musicLibrary[currentGenre].push(item);
                    currentName = "";
                }
            }
        }

        function setupGenreUI() {
            const genres = Object.keys(musicLibrary);
            if (genres.length === 0) return;
            const container = document.getElementById('sliders-container');
            container.innerHTML = "";
            
            const savedPreset = localStorage.getItem('miramar_genre_preset');
            let preset = null;
            if (savedPreset) {
                const rawPreset = JSON.parse(savedPreset);
                preset = {};
                // HIGIENIZA AS CHAVES DO PRESET ANTIGO, CASO EXISTAM
                for (let k in rawPreset) {
                    preset[k.replace(/[.#$/\[\]]/g, '-')] = rawPreset[k];
                }
            }
            
            const defaultPerc = Math.floor(100 / genres.length);
            genres.forEach((g, idx) => {
                if (genreMix[g] === undefined) {
                    if (preset && preset[g] !== undefined) { genreMix[g] = preset[g]; } 
                    else { genreMix[g] = (idx === genres.length - 1) ? 100 - (defaultPerc * (genres.length - 1)) : defaultPerc; }
                }
                const row = document.createElement('div');
                row.className = "genre-row";
                row.innerHTML = `<div class="genre-info"><span>${g}</span><span id="label-${g}">${genreMix[g]}%</span></div><input type="range" class="genre-slider" data-genre="${g}" min="0" max="100" value="${genreMix[g]}">`;
                container.appendChild(row);
            });
            document.querySelectorAll('.genre-slider').forEach(slider => {
                slider.addEventListener('input', (e) => adjustOtherSliders(e.target.dataset.genre, parseInt(e.target.value)));
            });
            updateSliderUI();
        }

        function saveGenrePreset() { 
            localStorage.setItem('miramar_genre_preset', JSON.stringify(genreMix)); 
            showToast("Preset de gêneros salvo!"); 
        }

        function adjustOtherSliders(changedGenre, newVal) {
            const genres = Object.keys(genreMix);
            if (genres.length <= 1) { genreMix[changedGenre] = 100; updateSliderUI(); return; }
            const oldVal = genreMix[changedGenre], diff = newVal - oldVal;
            genreMix[changedGenre] = newVal;
            const others = genres.filter(g => g !== changedGenre);
            let totalOthers = others.reduce((sum, g) => sum + genreMix[g], 0);
            if (totalOthers > 0) {
                others.forEach(g => {
                    const share = genreMix[g] / totalOthers;
                    genreMix[g] = Math.max(0, Math.round(genreMix[g] - (diff * share)));
                });
            } else {
                others.forEach(g => genreMix[g] = Math.max(0, Math.round(100 - newVal) / others.length));
            }
            let currentTotal = Object.values(genreMix).reduce((a, b) => a + b, 0);
            if (currentTotal !== 100) genreMix[others[0]] += (100 - currentTotal);
            updateSliderUI();
        }

        function updateSliderUI() {
            for (let g in genreMix) {
                const input = document.querySelector(`.genre-slider[data-genre="${g}"]`);
                const label = document.getElementById(`label-${g}`);
                if (input) input.value = genreMix[g];
                if (label) label.textContent = genreMix[g] + "%";
            }
        }

        async function aplicarMixNosEstudios() {
            if (selecionados.size === 0) return alert("Selecione pelo menos um estúdio para aplicar a programação.");
            saveGenrePreset();
            
            const payload = {
                mix: genreMix,
                timestamp: Date.now()
            };

            const promises = Array.from(selecionados).map(id => {
                return Promise.all([
                    db.ref(`status_radio/instancias/${id}/comando_mix_generos`).set(payload),
                ]);
            });
            
            await Promise.all(promises);
            showToast("Mix de gêneros enviado para os estúdios!");
        }

        function filtrarMusicas(query) {
            const resultsDiv = document.getElementById('results');
            if (!query) { resultsDiv.innerHTML = ""; return; }
            const filtradas = bibliotecaMusicas.filter(m => m.name.toLowerCase().includes(query.toLowerCase())).slice(0, 15);
            resultsDiv.innerHTML = filtradas.map(m => `
                <div class="result-item">
                    <span>${m.name}</span>
                    <div class="actions">
                        <button class="btn-add btn-add-next" onclick="adicionarFila('${m.url}', '${m.name}', 'next')">Tocar a Seguir</button>
                        <button class="btn-add" onclick="adicionarFila('${m.url}', '${m.name}', 'last')">Fim da Fila</button>
                    </div>
                </div>
            `).join('');
        }

        async function processarArquivosAudio(input) {
            if (selecionados.size === 0) {
                alert("Selecione um estúdio primeiro!");
                input.value = "";
                return;
            }
            const files = Array.from(input.files);
            if (files.length === 0) return;
            showToast(`Processando ${files.length} áudios...`);
            for (const file of files) {
                if (file.size > 7 * 1024 * 1024) {
                    alert(`O áudio ${file.name} é muito grande (Máximo 7MB).`);
                    continue;
                }
                try {
                    const base64 = await convertFileToBase64(file);
                    await enviarAudioBase64Sincrono(base64, "📁 " + file.name.toUpperCase());
                    showToast(`Enviado: ${file.name}`);
                } catch (err) {
                    console.error("Erro no processamento:", file.name, err);
                }
            }
            input.value = ""; 
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function enviarAudioBase64Sincrono(base64, nomeDisplay) {
            const promises = Array.from(selecionados).map(id => {
                return db.ref(`status_radio/instancias/${id}/comando_fila`).set({
                    acao: "ADICIONAR",
                    url: base64,
                    name: nomeDisplay,
                    posicao: "next",
                    timestamp: Date.now()
                    
                });
            });
            return Promise.all(promises);
        }

        async function gerarLocucaoIA() {
            const placa = document.getElementById('placaInput').value.trim();
            if (!placa) return alert("Digite a placa!");
            if (selecionados.size === 0) return alert("Selecione um estúdio!");

            const placaSoletrada = placa.toUpperCase().split('').join(' ');
            const texto = `Atenção! o proprietário do veículo de placa... ${placaSoletrada}. favor comparecer à recepção.`;
            
            const promises = Array.from(selecionados).map(id => {
                return db.ref(`status_radio/instancias/${id}/comando_fila`).set({
                    acao: "FALAR_TEXTO", 
                    texto: texto,
                    name: `🤖 PLACA: ${placa.toUpperCase()}`,
                    timestamp: Date.now()
                });
            });

            await Promise.all(promises);
            showToast("Comando de voz enviado!");
            document.getElementById('placaInput').value = "";
        }

        async function toggleGravarLocucao() {
            if (selecionados.size === 0) return alert("Selecione um estúdio!");
            const btn = document.getElementById('btnRecord');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                    });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const base64data = await convertFileToBase64(audioBlob);
                        await enviarAudioBase64Sincrono(base64data, "🎤 LOCUÇÃO HD");
                        showToast("Áudio HD enviado!");
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.innerText = "🛑 Parar e Enviar HD";
                    btn.classList.add('recording-pulse');
                    showToast("Gravando em HD...");
                } catch (err) { alert("Erro de microfone: " + err); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.innerText = "🎤 Locução em HD";
                btn.classList.remove('recording-pulse');
            }
        }

        db.ref('status_radio/instancias').on('value', (snapshot) => {
            const data = snapshot.val();
            const grid = document.getElementById('instancias-grid');
            const rankingGrid = document.getElementById('ranking-grid');
            const countLabel = document.getElementById('count');
            
            if (!data) {
                grid.innerHTML = "<p style='text-align:center;'>Nenhum estúdio ativo.</p>";
                rankingGrid.innerHTML = grid.innerHTML;
                countLabel.innerText = "0 estúdios";
                return;
            }

            todasKeys = Object.keys(data);
            countLabel.innerText = `${todasKeys.length} estúdios ativos`;
            grid.innerHTML = "";
            rankingGrid.innerHTML = "";

            let algumMutadoSelecionado = false;

            todasKeys.forEach(key => {
                const inst = data[key];
                const isSelected = selecionados.has(key);
                const estaMutado = inst.mutado === true;
                let nomeExibicao = key;

                if (inst.ip_studio === "2804:9f8:4780:89c1:f9a9:22d0:47a9:5400") {
                    nomeExibicao = "STUDIO HOME";
                }

                if (isSelected && estaMutado) algumMutadoSelecionado = true;

                let volumeContent = estaMutado ? `<div class="mute-label-big">🔇 MUTADO</div>` : `
                    <div class="volume-individual" onclick="event.stopPropagation()">
                        <div class="vol-label"><span>🔈 VOLUME ATUAL</span><span id="label-vol-${key}">${inst.volume_atual || 100}%</span></div>
                        <input type="range" id="vol-${key}" min="0" max="100" value="${inst.volume_atual || 100}" oninput="ajustarVolumeIndividual('${key}', this.value)">
                    </div>
                `;

                // Pega as 3 próximas músicas enviadas na estrutura do estúdio
                let listaProximas = inst.proximas_musicas || inst.fila || [];
                if (typeof listaProximas === 'object' && !Array.isArray(listaProximas)) {
                    listaProximas = Object.values(listaProximas);
                }
                const proximasTres = Array.isArray(listaProximas) ? listaProximas.slice(0, 3) : [];

                let htmlProximas = '<li class="proxima-item" style="color: #777;">Nenhuma música na fila</li>';

if (proximasTres.length > 0) {
    htmlProximas = proximasTres.map((item, idx) => {

        const nomeMusica = typeof item === 'string'
    ? item
    : (item.name || item.nome || item.title || 'Música ' + (idx + 1));

const urlMusica = typeof item === 'object'
    ? (item.url || '')
    : '';

        return `
            <li class="proxima-item">

                <span class="proxima-num">${idx + 1}.</span>

                <span 
                    class="proxima-nome"
                    title="${nomeMusica}"
                >
                    ${nomeMusica}
                </span>

                <button
                    class="btn-remover-proxima"
                    title="Remover música da fila"
                    onclick="event.stopPropagation(); removerMusicaDaFila('${key}', '${encodeURIComponent(urlMusica)}', '${encodeURIComponent(nomeMusica)}')"
                >
                    <svg
                        width="17"
                        height="17"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>

            </li>
        `;

    }).join('');
}

                const card = document.createElement('div');
                card.className = `card ${isSelected ? 'selected' : ''} ${estaMutado ? 'muted-card' : ''}`;
                card.onclick = () => toggleSelect(key);
                card.innerHTML = `
                    <div class="checkbox-container"><input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation();" onchange="toggleSelect('${key}')"></div>
                    <span class="instancia-nome">ESTÚDIO ID: ${nomeExibicao}</span>
                    <span class="musica-atual">${inst.musica_atual || 'Sintonizando...'}</span>
                    <div class="info-row">📍 ${inst.localizacao || 'Local desconhecido'}</div>
                    <div class="info-row">⏱️ Online: ${inst.tempo_online || '---'}</div>
                    <div class="info-row">
                        <span class="status-badge ${inst.tocando ? 'playing' : 'paused'}">${inst.tocando ? '● NO AR' : '○ PAUSADO'}</span>
                        <span class="tempo-restante">⏳ Restam: ${inst.tempo_restante || '00:00'}</span>
                    </div>
                    <div class="proximas-container">
                        <div class="proximas-titulo">🎵 PRÓXIMAS MÚSICAS</div>
                        <ul class="proximas-lista">
                            ${htmlProximas}
                        </ul>
                    </div>
                    ${volumeContent}
                `;
                grid.appendChild(card);
                
                if (inst.ranking_estudio) {
                    const sorted = Object.entries(inst.ranking_estudio).sort((a,b) => b[1] - a[1]).slice(0, 10);
                    let rankingHtml = `<div class="mini-ranking"><h4>🏆 TOP 10</h4>`;
                    sorted.forEach(([musica, qtd]) => { rankingHtml += `<div class="ranking-item-row"><span>${musica}</span><b>${qtd}x</b></div>`; });
                    rankingHtml += `</div>`;
                    const rankCard = document.createElement('div');
                    rankCard.className = "card";
                    rankCard.innerHTML = `<span class="instancia-nome">RANKING: ${nomeExibicao}</span>${rankingHtml}`;
                    rankingGrid.appendChild(rankCard);
                }
            });

            const btnMute = document.getElementById('btnMuteMaster');
            if (btnMute) {
                btnMute.innerText = algumMutadoSelecionado ? "🔇 Mutado (Unmute)" : "🔊 Mute/Unmute";
                algumMutadoSelecionado ? btnMute.classList.add('btn-muted-active') : btnMute.classList.remove('btn-muted-active');
            }
        });

        function toggleSelect(id) { 
            selecionados.has(id) ? selecionados.delete(id) : selecionados.add(id); 
            db.ref(`status_radio/instancias/${id}/_ping`).set(Date.now());
        }

        function toggleSelectAll() { 
            if (selecionados.size === todasKeys.length) {
                selecionados.clear();
            } else {
                todasKeys.forEach(k => selecionados.add(k));
            }
            db.ref('status_radio/instancias').once('value', () => {});
        }

        function ajustarVolumeIndividual(id, val) {
            const label = document.getElementById(`label-vol-${id}`);
            if(label) label.innerText = val + '%';
            db.ref(`status_radio/instancias/${id}/comando_volume`).set(parseInt(val));
        }

        async function removerMusicaDaFila(studioId, urlEncoded, nomeEncoded) {

    const url = decodeURIComponent(urlEncoded);
    const nome = decodeURIComponent(nomeEncoded);

    if (!studioId || !nome) return;

    if (!confirm(`Remover "${nome}" da fila?`)) {
        return;
    }

    try {

        await db
            .ref(`status_radio/instancias/${studioId}/comando_fila`)
            .set({
                acao: "REMOVER",
                url: url,
                name: nome,
                timestamp: Date.now()
            });

        showToast(`🗑️ "${nome}" removida da fila!`);

    } catch (erro) {

        console.error("Erro ao remover música:", erro);

        showToast("❌ Erro ao remover música.");

    }
}

        async function enviarComando(comando) {
            if (selecionados.size === 0) return alert("Selecione um estúdio.");
            const promises = Array.from(selecionados).map(id => db.ref(`status_radio/instancias/${id}/comando_acao`).set(comando));
            await Promise.all(promises);
            showToast("Comando enviado!");
        }

        async function atualizarNavegadorRemoto() {
            if (selecionados.size === 0) return alert("Selecione um estúdio para atualizar.");
            if (confirm("Deseja realmente reiniciar o navegador dos estúdios selecionados?")) {
                const promises = Array.from(selecionados).map(id => {
                    return db.ref(`status_radio/instancias/${id}/comando_atualizar`).set(true);
                });
                await Promise.all(promises);
                showToast("Comando de reinicialização enviado!");
            }
        }

        async function enviarMensagem() {
            const msg = document.getElementById('msgInput').value;
            if (!msg || selecionados.size === 0) return alert("Selecione um estúdio!");
            const promises = Array.from(selecionados).map(id => db.ref(`status_radio/instancias/${id}/comando_mensagem`).set(msg));
            await Promise.all(promises);
            document.getElementById('msgInput').value = "";
            showToast("Mensagem enviada!");
        }

        async function adicionarFila(url, nome, posicao) {
            if (selecionados.size === 0) return alert("Selecione um estúdio!");
            const promises = Array.from(selecionados).map(id => {
                return db.ref(`status_radio/instancias/${id}/comando_fila`).set({
                    acao: "ADICIONAR", url: url, name: nome, posicao: posicao, timestamp: Date.now()
                });
            });
            await Promise.all(promises);
            showToast(`${nome} adicionada!`);
        }

        function limparEstudiosAntigos() {
            if (confirm("Deseja remover estúdios fantasma? Isso limpará a lista e eles reaparecerão conforme se conectarem.")) { 
                db.ref('status_radio/instancias').remove(); 
                selecionados.clear(); 
            }
        }

        async function removerEstudiosSelecionados() {
            if (selecionados.size === 0) return alert("Selecione pelo menos um estúdio para remover.");
            if (confirm(`Deseja remover os ${selecionados.size} estúdios selecionados?`)) {
                const promises = Array.from(selecionados).map(id => db.ref(`status_radio/instancias/${id}`).remove());
                await Promise.all(promises);
                selecionados.clear();
                showToast("Estúdios removidos com sucesso!");
            }
        }

        carregarBiblioteca();
    </script>
